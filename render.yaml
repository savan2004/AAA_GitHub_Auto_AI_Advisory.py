services:
  - type: web
    name: aaa-github-auto-ai-advisory
    env: python
    plan: free
    rootDir: .
    buildCommand: bash builder.sh
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEBHOOK_URL
        value: https://aaa-github-auto-ai-advisory-py.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_TOKEN
        sync: false
