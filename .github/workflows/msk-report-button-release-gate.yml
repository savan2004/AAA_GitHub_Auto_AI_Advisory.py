name: MSK Research PDF Button Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'pdf_release_gate.py'
      - 'tests/test_report_button_release_gate.py'
      - '.github/workflows/msk-report-button-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'pdf_release_gate.py'
      - 'tests/test_report_button_release_gate.py'
      - '.github/workflows/msk-report-button-release-gate.yml'

permissions:
  contents: read

jobs:
  report-button-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF release validator
        run: python -m pip install 'pypdf>=5,<7'
      - name: Check source syntax
        run: python -m py_compile main.py pdf_release_gate.py tests/test_report_button_release_gate.py
      - name: Verify actual report button never sends an unverified PDF
        run: python -m unittest discover -s tests -p test_report_button_release_gate.py -v
