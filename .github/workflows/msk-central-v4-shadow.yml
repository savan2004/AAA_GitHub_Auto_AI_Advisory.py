name: MSK Central V4 offline safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'msk_central_*_v4.py'
      - 'tests/test_msk_central_*_v4.py'
      - '.github/workflows/msk-central-v4-shadow.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free isolated contracts
        run: python3 -m unittest discover -s tests -p 'test_msk_central_*_v4.py' -v
