name: MSK Central V4 offline safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'msk_central_*_v4.py'
      - 'tests/test_msk_central_*_v4.py'
      - 'scripts/msk_central_500_evidence.py'
      - '.github/workflows/msk-central-v4-shadow.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free isolated contracts
        run: python3 -m unittest discover -s tests -p 'test_msk_central_*_v4.py' -v
  official-eod-500:
    if: github.event.pull_request.number == 300
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify full observed official roster and 27 November final OHLCV
        run: python3 scripts/msk_central_500_evidence.py --session 2026-11-27
