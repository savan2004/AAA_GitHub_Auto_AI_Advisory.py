name: MSK Portfolio Message Idempotency - Isolated PostgreSQL QA

on:
  pull_request:
    paths:
      - "postgres_portfolio.py"
      - "main.py"
      - "tests/test_msk_portfolio_message_idempotency_pg.py"
      - ".github/workflows/msk-portfolio-message-idempotency-qa.yml"

permissions:
  contents: read

jobs:
  idempotency-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: msk_idempotency_test
          POSTGRES_USER: msk_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msk_test -d msk_idempotency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSK_IDEMPOTENCY_PG_TEST: "YES"
      MSK_IDEMPOTENCY_TEST_DATABASE_URL: "postgresql://msk_test:synthetic_ci_only@localhost:5432/msk_idempotency_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PostgreSQL test dependency
        run: python -m pip install "psycopg[binary]>=3.1,<4"
      - name: Verify atomic message receipts, rollback and concurrency
        run: |
          python -m unittest discover -s tests -p 'test_msk_portfolio_message_idempotency_pg.py' -v
          python -m py_compile postgres_portfolio.py tests/test_msk_portfolio_message_idempotency_pg.py
