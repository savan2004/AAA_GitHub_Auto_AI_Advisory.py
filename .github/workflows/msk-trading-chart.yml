name: MSK Trading Chart Engine
on:
  pull_request:
    branches: [main]
    paths:
      - 'trading_chart/**'
      - 'tests/test_engine.py'
      - 'demo/generate_demos.py'
      - '.github/workflows/msk-trading-chart.yml'
  workflow_dispatch:

jobs:
  chart-engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install chart dependencies
        run: python -m pip install -r trading_chart/requirements.txt pytest==8.4.2
      - name: Run quant/pattern acceptance tests
        run: python -m pytest tests/test_engine.py -v
      - name: Generate four offline interactive demo charts and JSON
        run: python demo/generate_demos.py
      - name: Upload interactive HTML and JSON demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: msk-trading-chart-demos
          path: msk_chart_examples/
          retention-days: 7
