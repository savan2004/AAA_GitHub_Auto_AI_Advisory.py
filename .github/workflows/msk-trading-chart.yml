name: MSK Trading Chart Engine
on:
  pull_request:
    branches: [main]
    paths:
      - 'trading_chart/**'
      - 'tests/test_engine.py'
      - 'tests/test_legacy_chart_quant.py'
      - 'gen_smart_stock_chart.py'
      - 'legacy_chart_quant.py'
      - 'demo/generate_demos.py'
      - '.github/workflows/msk-trading-chart.yml'
  workflow_dispatch:

jobs:
  chart-engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install chart dependencies
        run: python -m pip install -r trading_chart/requirements.txt pytest==8.4.2 matplotlib==3.9.0 mplfinance==0.12.10b0 yfinance==0.2.61 curl_cffi==0.7.4
      - name: Run deterministic 9-pattern quant engine tests
        run: python -m pytest tests/test_engine.py -v
      - name: Render original v7 PNG with new quant analysis and verify layout
        run: python -m pytest tests/test_legacy_chart_quant.py -sv
      - name: Generate four offline interactive demo charts and JSON
        run: python demo/generate_demos.py
      - name: Upload original v7 PNG and interactive chart demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: msk-v7-original-template-quant-demos
          path: msk_chart_examples/
          retention-days: 7
