name: MSK weekly real-source rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/msk-weekly-real-source-rehearsal.yml'
      - 'msk_ai_builder_evidence.py'
      - 'msk_ai_builder_quarter_check.py'
      - 'msk_ai_builder_discovery.py'
      - 'msk_ai_builder_filings.py'
      - 'msk_ai_builder_weekly*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 pandas==2.2.2 numpy==1.26.4 yfinance==0.2.61 curl_cffi==0.7.4 'psycopg[binary]>=3.2,<3.4'
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_filings.py' -v
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_discovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_quarter_check.py' -v
      - name: Rehearse refresh against real public sources and disposable PostgreSQL
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          import psycopg
          from msk_ai_builder_bank import BankError, WeeklyResearchBank
          from msk_ai_builder_weekly_job import run_weekly_job
          from msk_ai_builder_weekly import stage_week
          from msk_ai_builder_quarter_check import check_latest_quarter
          from msk_ai_builder_evidence import EvidenceError

          def connect(_):
              return psycopg.connect("postgresql://builder_test:local_ci_only@localhost:5432/builder_test")
          def factory(**_):
              return WeeklyResearchBank("postgresql://test@localhost/test?sslmode=require", connector=connect)

          env = {"MSK_BUILDER_WEEKLY_JOB_ENABLED": "1"}
          primary_checks = []
          def diagnosed_refresh(bank, **kwargs):
              result, version = stage_week(bank, **kwargs)
              print("PUBLIC_PERIOD_FAILURES", json.dumps(result.failures, sort_keys=True))
              # Bounded primary-source pilot: three actual staged issuers irrespective of scope.
              print("PRIMARY_PILOT_SCOPES", json.dumps({c.member.symbol: c.evidence.scope for c in result.companies[:3]}, sort_keys=True))
              for company in result.companies[:3]:
                  try:
                      primary_checks.append(check_latest_quarter(company.member, company.evidence))
                  except EvidenceError as exc:
                      primary_checks.append({"symbol": company.member.symbol, "status": str(exc), "publication_status": "WITHHELD"})
              print("PRIMARY_QUARTER_CHECKS", json.dumps(primary_checks, sort_keys=True))
              return result, version
          first = run_weekly_job(environ=env, bank_factory=factory, refresh=diagnosed_refresh)
          print("FIRST_REFRESH", json.dumps(first, sort_keys=True))
          Path("weekly-rehearsal.json").write_text(json.dumps({"first": first}, indent=2))
          assert first["status"] == "INTERNAL_SECONDARY_STAGING"
          assert len(primary_checks) == min(3, first["selected"]), "Primary pilot did not exercise selected issuers"
          match_count = sum(c["status"] == "LATEST_QUARTER_MATCHED_ONLY" for c in primary_checks)
          print("PRIMARY_MATCH_COUNT", match_count)
          bank = factory()
          version, rows = bank.read_staging()
          assert version == first["version"]
          assert 1 <= len(rows["companies"]) == first["selected"] <= 20
          assert rows["publication_status"] == "WITHHELD"
          assert all(r["evidence_status"] == "SECONDARY_ONLY" for r in rows["companies"])
          assert all(r["price_status"] == "SOURCE_REFERENCE_NOT_RECONCILED" for r in rows["companies"])
          assert first["attempted"] <= 40
          again = run_weekly_job(environ=env, bank_factory=factory)
          assert again["status"] == "SKIPPED_ALREADY_REVIEWED"
          assert bank.read_staging()[0] == version
          with connect(None) as conn:
              assert conn.execute("SELECT count(*) FROM msk_builder_research.snapshots").fetchone()[0] == 1
          try:
              bank.read_for_customer()
          except BankError as exc:
              assert str(exc) == "PRODUCTION_PUBLICATION_DISABLED"
          else:
              raise AssertionError("Unapproved customer publication")
          Path("weekly-rehearsal.json").write_text(json.dumps({"first": first, "replay": again, "primary_checks": primary_checks, "publication_blocked": True}, indent=2))
          print("REPLAY", json.dumps(again, sort_keys=True))
          assert len(primary_checks) == 3 and match_count == 3, "Three-company numeric reconciliation gate not met"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msk-weekly-rehearsal-summary
          path: weekly-rehearsal.json
          if-no-files-found: warn
          retention-days: 7
