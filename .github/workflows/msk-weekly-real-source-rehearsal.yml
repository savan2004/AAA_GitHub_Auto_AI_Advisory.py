name: MSK weekly real-source rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/msk-weekly-real-source-rehearsal.yml'
      - 'msk_ai_builder_evidence.py'
      - 'msk_ai_builder_quarter_check.py'
      - 'msk_ai_builder_discovery.py'
      - 'msk_ai_builder_filings.py'
      - 'msk_ai_builder_diagnostics.py'
      - 'tests/test_msk_ai_builder_diagnostics.py'
      - 'tests/test_msk_ai_builder_bank_accounting.py'
      - 'msk_ai_builder_weekly*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 pandas==2.2.2 numpy==1.26.4 yfinance==0.2.61 curl_cffi==0.7.4 'psycopg[binary]>=3.2,<3.4'
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_filings.py' -v
      - name: Verify issuer BANKING source arithmetic and disclosed-excise reconciliation
        run: python -m unittest discover -s tests -p 'test_msk_ai_builder_bank_accounting.py' -v
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_discovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_quarter_check.py' -v
      - name: Test machine-readable failure diagnosis without full market refresh
        run: python -m unittest discover -s tests -p 'test_msk_ai_builder_diagnostics.py' -v
      - name: Rehearse refresh against real public sources and disposable PostgreSQL
        run: |
          python -u - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg
          from msk_ai_builder_bank import BankError, WeeklyResearchBank
          from msk_ai_builder_weekly_job import run_weekly_job
          from msk_ai_builder_weekly import stage_week
          from msk_ai_builder_quarter_check import check_latest_quarter
          from msk_ai_builder_evidence import EvidenceError
          from msk_ai_builder_discovery import fetch_listing
          from msk_ai_builder_diagnostics import (
              diagnose_quarter, diagnostic_summary, diagnostic_markdown, audit_quarter_history)

          def connect(_):
              return psycopg.connect("postgresql://builder_test:local_ci_only@localhost:5432/builder_test")
          def factory(**_):
              return WeeklyResearchBank("postgresql://test@localhost/test?sslmode=require", connector=connect)

          env = {"MSK_BUILDER_WEEKLY_JOB_ENABLED": "1"}
          primary_checks = []
          diagnostics = {}
          staged_companies = []
          focus = {"COFORGE", "ICICIBANK", "BANKBARODA", "MCX", "RELIANCE"}
          # Persist the entire investigation after every company; never
          # overwrite 20-company data with just the later first/replay result.
          report = {"primary_checks": primary_checks,
                    "focus_diagnostics": diagnostics,
                    "publication_blocked": True}
          def persist(**updates):
              report.update(updates)
              Path("weekly-rehearsal.json").write_text(
                  json.dumps(report, indent=2, sort_keys=True))
          def publish_diagnostic():
              summary = diagnostic_summary(primary_checks, requested=20)
              persist(source_failure_diagnostic=summary)
              Path("weekly-rehearsal-summary.md").write_text(
                  diagnostic_markdown(summary))
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as output:
                      output.write(diagnostic_markdown(summary))
              print("SOURCE_FAILURE_DIAGNOSTIC", json.dumps(summary, sort_keys=True))
              return summary
          def diagnosed_listing(symbol, period):
              payload = fetch_listing(symbol, period)
              if symbol in focus:
                  rows = payload.get("data") if isinstance(payload, dict) else None
                  keys = ("symbol", "qe_Date", "consolidated", "broadcast_Date", "revised_Date", "ixbrl")
                  diagnostics[symbol] = {"totalCount": payload.get("totalCount") if isinstance(payload, dict) else None,
                      "data_type": type(rows).__name__, "row_count": len(rows) if isinstance(rows, list) else None,
                      "rows": [{k:r.get(k) for k in keys} for r in rows[:20] if isinstance(r, dict)] if isinstance(rows, list) else []}
                  print("FOCUS_METADATA", symbol, json.dumps(diagnostics[symbol], sort_keys=True))
              return payload
          def record_numeric(data):
              symbol = data["symbol"]
              if symbol in focus:
                  diagnostics.setdefault(symbol, {})["numeric_comparison"] = data
                  print("FOCUS_NUMERIC", json.dumps(data, sort_keys=True))
          def verify_candidate(member, evidence):
              observation = diagnose_quarter(member, evidence, listing=diagnosed_listing, audit=record_numeric)
              print("PRIMARY_PROGRESS", json.dumps(observation, sort_keys=True))
              return observation
          def diagnosed_refresh(bank, **kwargs):
              result, version = stage_week(bank, quarter_verifier=verify_candidate, **kwargs)
              print("PUBLIC_PERIOD_FAILURES", json.dumps(result.failures, sort_keys=True))
              primary_checks.extend(result.primary_checks)
              staged_companies.extend(result.companies)
              persist(primary_rejections=result.primary_rejections, reserves=result.reserves)
              print("PRIMARY_REJECTIONS", json.dumps(result.primary_rejections, sort_keys=True))
              print("PRIMARY_QUARTER_CHECKS", json.dumps(primary_checks, sort_keys=True))
              return result, version
          first = run_weekly_job(environ=env, bank_factory=factory, refresh=diagnosed_refresh)
          print("FIRST_REFRESH", json.dumps(first, sort_keys=True))
          persist(first=first)
          diagnostic = publish_diagnostic()
          assert first["status"] == "INTERNAL_SECONDARY_STAGING"
          assert len(primary_checks) == first["selected"], "Primary verification did not exercise every staged issuer"
          match_count = sum(c["status"] == "LATEST_QUARTER_MATCHED_ONLY" for c in primary_checks)
          print("PRIMARY_MATCH_COUNT", match_count)
          bank = factory()
          version, rows = bank.read_staging()
          assert version == first["version"]
          assert 1 <= len(rows["companies"]) == first["selected"] <= 20
          assert rows["publication_status"] == "WITHHELD"
          assert all(r["evidence_status"] == "SECONDARY_ONLY" for r in rows["companies"])
          assert all(r["price_status"] == "SOURCE_REFERENCE_NOT_RECONCILED" for r in rows["companies"])
          assert first["attempted"] <= 40
          again = run_weekly_job(environ=env, bank_factory=factory)
          assert again["status"] == "SKIPPED_ALREADY_REVIEWED"
          assert bank.read_staging()[0] == version
          with connect(None) as conn:
              assert conn.execute("SELECT count(*) FROM msk_builder_research.snapshots").fetchone()[0] == 1
          try:
              bank.read_for_customer()
          except BankError as exc:
              assert str(exc) == "PRODUCTION_PUBLICATION_DISABLED"
          else:
              raise AssertionError("Unapproved customer publication")
          persist(replay=again)
          print("REPLAY", json.dumps(again, sort_keys=True))
          assert len({c["symbol"] for c in primary_checks}) == first["selected"]
          assert {c["symbol"] for c in primary_checks} == {r["symbol"] for r in rows["companies"]}
          assert match_count == first["selected"] == 20 and diagnostic["rehearsal_passed"], (
              "Full 20-company latest-quarter match not met; see SOURCE_FAILURE_DIAGNOSTIC and attached report")
          # Keep already verified latest observations; exercise seven missing
          # historical periods per company without approving or writing production.
          from msk_ai_builder_discovery import discover_legacy_quarter
          history = audit_quarter_history(staged_companies, primary_checks,
              deadline_seconds=300, checkpoint=lambda result:persist(quarter_history=result),
              legacy_discover=discover_legacy_quarter)
          for row in history["companies"]:
              for period,obs in row["periods"].items():
                  if "legacy_discovery" in obs:
                      print("LEGACY_SOURCE_DISCOVERY",row["symbol"],period,
                            json.dumps(obs["legacy_discovery"],sort_keys=True))
          persist(quarter_history=history)
          print("HISTORICAL_QUARTER_COVERAGE",json.dumps({
              k:v for k,v in history.items() if k!="companies"},sort_keys=True))
          for row in history["companies"]:
              print("HISTORICAL_ISSUER_PERIODS",row["symbol"],json.dumps({
                  period:obs["status"] for period,obs in row["periods"].items()},sort_keys=True))
          assert history["matched"]==history["requested"]==160, (
              "Eight-quarter primary coverage incomplete; see quarter_history in attached report")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msk-weekly-rehearsal-summary
          path: |
            weekly-rehearsal.json
            weekly-rehearsal-summary.md
          if-no-files-found: warn
          retention-days: 7
