name: MSK AI Builder public filing probe
on:
  pull_request:
    paths:
      - 'msk_ai_builder_filings.py'
      - '.github/workflows/msk-ai-builder-public-probe.yml'
permissions:
  contents: read
jobs:
  public-filing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3
      - name: Verify one public exchange filing against observed page fields
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from decimal import Decimal
          from msk_ai_builder_primary import IndexMember
          from msk_ai_builder_filings import download_filing, extract_quarter
          # Fixed public historical-format smoke case, not a candidate or stock recommendation.
          url = "https://nsearchives.nseindia.com/corporate/ixbrl/INTEGRATED_FILING_INDAS_212819_12112026172147_iXBRL_WEB.html"
          doc = download_filing(url)
          result = extract_quarter(doc, IndexMember("NIRAJISPAT", "INE326T01011"),
                                   expected_end=date(2026,9,30), now=datetime.now(timezone.utc))
          assert result.revenue_cr == Decimal("1.1623"), "Revenue fixture mismatch or revised document"
          assert result.profit_cr == Decimal("0.4364"), "Profit fixture mismatch or revised document"
          print("PUBLIC_DOCUMENT_MATCHED", result.status, result.digest)
          PY
