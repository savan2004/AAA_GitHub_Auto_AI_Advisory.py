name: Startup and Portfolio Regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated regression suite
        run: |
          python -m unittest discover -s tests -p 'test_startup_portfolio_regression.py' -v
          python -m unittest discover -s tests -p 'test_msk_menu_audit.py' -v
