name: Startup and Portfolio Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install numerical dependencies for safety-gate tests
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' requests
      - name: Deep P0 integration and accuracy regression (mock/synthetic)
        env:
          TELEGRAM_TOKEN: "synthetic-test-token-not-an-actual-secret"
        run: |
          python -m py_compile main.py data_engine.py fundamentals.py financial_quality.py technical_price_safety.py postgres_portfolio.py portfolio_migration.py portfolio_backup_preflight.py msk_durable_state.py
          python -m unittest discover -s tests -p 'test_msk_release_safety.py' -v
          python -m unittest discover -s tests -p 'test_msk_financial_provenance.py' -v
          python -m unittest discover -s tests -p 'test_msk_postgres_migration.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_backup_preflight.py' -v
          python -m unittest discover -s tests -p 'test_msk_durable_state.py' -v
          python -m unittest discover -s tests -p 'test_msk_delivery_receipts.py' -v
          python -m unittest discover -s tests -p 'test_msk_equity_portfolio_p0.py' -v
      - name: Run isolated regression suite
        run: |
          python -m unittest discover -s tests -p 'test_startup_portfolio_regression.py' -v
          python -m unittest discover -s tests -p 'test_msk_menu_audit.py' -v
          python -m unittest discover -s tests -p 'test_msk_codex_controller.py' -v
