name: Startup and Portfolio Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run isolated regression suite
        run: |
          python -m unittest discover -s tests -p 'test_startup_portfolio_regression.py' -v
          python -m unittest discover -s tests -p 'test_msk_menu_audit.py' -v
          python -m unittest discover -s tests -p 'test_msk_codex_controller.py' -v
