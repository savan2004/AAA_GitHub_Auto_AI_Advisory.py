name: MSK SBIN Real Research PDF Release Probe
on:
  push:
    branches: [main]
    paths:
      - tests/probe_sbin_pdf.py
      - .github/workflows/msk-sbin-pdf-probe.yml
      - pdf_release_gate.py
      - report_generator.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sb-in-real-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      TELEGRAM_TOKEN: '123:offline-test'
      MSK_RESEARCH_ONLY: '1'
      MPLBACKEND: 'Agg'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build and validate actual SBIN PDF without Telegram
        run: PYTHONPATH=. timeout 720s python -u tests/probe_sbin_pdf.py
