name: MSK Swing Accuracy Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'swing_trades.py'
      - 'tests/test_swing_accuracy_gates.py'
      - '.github/workflows/msk-swing-accuracy.yml'
  push:
    branches: [main]
    paths:
      - 'swing_trades.py'
      - 'tests/test_swing_accuracy_gates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swing-accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - run: python -m py_compile swing_trades.py tests/test_swing_accuracy_gates.py
      - run: python -m unittest discover -s tests -p 'test_swing_accuracy_gates.py' -v
