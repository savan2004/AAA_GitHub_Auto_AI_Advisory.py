name: MSK Builder external source adapter — offline QA
on:
  pull_request:
    paths:
      - 'msk_builder_external_source_probe.py'
      - 'tests/test_msk_builder_external_source_probe.py'
      - '.github/workflows/msk-builder-external-sources.yml'
      - 'docs/MSK_EXTERNAL_SOURCE_INTEGRATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile read-only adapter
        run: python -m py_compile msk_builder_external_source_probe.py tests/test_msk_builder_external_source_probe.py
      - name: Verify strict source, date, units, identity and no-customer-publication contracts
        run: python -m unittest discover -s tests -p 'test_msk_builder_external_source_probe.py' -v
      - name: Builder research publication must stay withheld
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("msk_builder_research_release_registry.json").read_text())
          assert registry["publication_status"] == "WITHHELD"
          assert registry["approved"] == []
          PY
