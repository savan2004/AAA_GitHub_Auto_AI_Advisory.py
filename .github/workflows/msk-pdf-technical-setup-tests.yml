name: MSK PDF Technical Setup Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'pdf_technical_setup.py'
      - 'report_generator.py'
      - 'pdf_release_gate.py'
      - 'tests/test_pdf_release_gate.py'
      - 'tests/emit_pdf_qa_fixture.py'
      - 'requirements.txt'
      - 'technical_indicators.py'
      - 'tests/test_pdf_technical_setup.py'
      - '.github/workflows/msk-pdf-technical-setup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TELEGRAM_TOKEN: '123:offline-test'
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked research dependencies for offline image/PDF fixture
        run: python -m pip install --disable-pip-version-check -r requirements.txt pypdf
      - name: Generate two chart pages and full PDF with synthetic fixtures
        run: python -m unittest discover -s tests -p test_pdf_technical_setup.py -v
      # Full legacy fundamental suite currently fails against main because
      # report_generator.assemble() lacks 'asof'/'completeness'; tracked separately
      # in the daily fundamental research workstream (PR #39).
      - name: Require eight-page readable disclaimer-verified research PDF
        run: python -m unittest discover -s tests -p test_pdf_release_gate.py -v
      - name: Render every sample research page and check visible ink
        run: |
          python -m pip install 'pypdfium2>=4,<6' 'Pillow>=10,<13'
          MSK_SYNTHETIC_QA_DIR="$RUNNER_TEMP/msk-pdf-synthetic-qa" python tests/emit_pdf_qa_fixture.py
      - name: Preserve synthetic report and contact sheet for visual review
        uses: actions/upload-artifact@v4
        with:
          name: MSK-SYNTHETIC-PDF-NOT-FOR-DISTRIBUTION
          path: ${{ runner.temp }}/msk-pdf-synthetic-qa/
          retention-days: 7
          if-no-files-found: error
      - name: Check Python syntax
        run: python -m py_compile pdf_technical_setup.py report_generator.py pdf_release_gate.py technical_indicators.py report_quarterly_charts.py
