name: MSK Magazine - Monthly Design 3 Draft and Safety QA

on:
  pull_request:
    paths:
      - "scripts/msk_magazine_monthly.py"
      - "tests/test_msk_magazine_monthly.py"
      - "docs/msk_magazine/**"
      - ".github/workflows/msk-magazine-monthly.yml"
  push:
    branches: [main]
    paths:
      - "scripts/msk_magazine_monthly.py"
      - "tests/test_msk_magazine_monthly.py"
      - "docs/msk_magazine/**"
      - ".github/workflows/msk-magazine-monthly.yml"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue YYYY-MM; blank = current IST month"
        required: false
        type: string
  # Daily 02:30 UTC = 08:00 IST. The first Monday starts a new issue;
  # subsequent days continue it without overwriting prior run evidence.
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: msk-magazine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF-only open-source dependencies
        run: python -m pip install reportlab==4.2.5 "pypdf>=5,<7" requests==2.32.3 chardet==5.2.0
      - name: Run financial, schedule, document and release-gate tests
        run: python -m unittest discover -s tests -p 'test_msk_magazine_monthly.py' -v
      - name: Run NSE archive downloader and integrated PDF regression tests
        run: python -m unittest discover -s tests -p 'test_msk_magazine_nse.py' -v
      - name: Compile monthly workflow sources
        run: python -m py_compile scripts/msk_magazine_monthly.py scripts/msk_magazine_nse.py

  monthly-draft:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write  # only for GitHub draft release archival, never public publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF engine
        run: python -m pip install reportlab==4.2.5 "pypdf>=5,<7" requests==2.32.3 chardet==5.2.0
      - name: Resolve IST issue and first-Monday or continuation mode
        id: schedule
        env:
          REQUESTED_ISSUE: ${{ inputs.issue }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          from scripts.msk_magazine_monthly import scheduled_issue_mode
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          issue, mode = scheduled_issue_mode(
              now, os.environ["EVENT_NAME"], os.environ.get("REQUESTED_ISSUE", ""))
          run_root = f"magazine_artifacts/{issue}/runs/{os.environ['GITHUB_RUN_ID']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"due=true\\nissue={issue}\\nmode={mode}\\nrun_root={run_root}\\n")
          print(f"Issue={issue}; mode={mode}; run_root={run_root}")
          PY
      - name: Retrieve official month-end NSE CSV into this run's isolated folder
        if: steps.schedule.outputs.due == 'true'
        env:
          ISSUE: ${{ steps.schedule.outputs.issue }}
          RUN_ROOT: ${{ steps.schedule.outputs.run_root }}
        run: |
          mkdir -p "$RUN_ROOT"
          python scripts/msk_magazine_nse.py --issue "$ISSUE" --output-dir "$RUN_ROOT/sources"
      - name: Generate isolated 16-page UNAPPROVED draft revision
        if: steps.schedule.outputs.due == 'true'
        env:
          ISSUE: ${{ steps.schedule.outputs.issue }}
          MODE: ${{ steps.schedule.outputs.mode }}
          RUN_ROOT: ${{ steps.schedule.outputs.run_root }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          SOURCE_ARGS=()
          if [ -f "$RUN_ROOT/sources/source_pack.json" ]; then
            SOURCE_ARGS=(--source-pack "$RUN_ROOT/sources/source_pack.json" --source-root "$RUN_ROOT/sources")
          fi
          OUTPUT_DIR="$RUN_ROOT/output"
          if [ "$MODE" = "first_monday" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/msk_magazine_monthly.py --issue "$ISSUE" --scheduled --output-dir "$OUTPUT_DIR" "${SOURCE_ARGS[@]}"
          else
            python scripts/msk_magazine_monthly.py --issue "$ISSUE" --output-dir "$OUTPUT_DIR" "${SOURCE_ARGS[@]}"
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root = Path(os.environ["RUN_ROOT"])
          issue_dir = root / "output" / os.environ["ISSUE"]
          gate = json.loads((issue_dir / "release_gate.json").read_text(encoding="utf-8"))
          source_pack = root / "sources" / "source_pack.json"
          source_failures = root / "sources" / "source_fetch_failures.json"
          source_date = None
          if source_pack.is_file():
              source_date = json.loads(source_pack.read_text(encoding="utf-8")).get("source_date")
          failures = []
          if source_failures.is_file():
              failures = json.loads(source_failures.read_text(encoding="utf-8")).get("failures", [])
          manifest = {
              "issue": os.environ["ISSUE"], "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"], "commit_sha": os.environ["RUN_SHA"],
              "mode": os.environ["MODE"], "created_at_ist": datetime.now(ZoneInfo("Asia/Kolkata")).isoformat(),
              "pdf_sha256": gate["pdf_sha256"], "source_date": source_date,
              "source_consistency_rows": gate["source_consistency_rows"],
              "source_fetch_failures": failures, "source_authenticity_verified": False,
              "editorial_approved": False, "publication_allowed": False,
              "status": "UNAPPROVED_DRAFT; ORIGINAL_EDITORIAL_RESEARCH_PENDING"
          }
          (issue_dir / "run_manifest.json").write_text(json.dumps(manifest, indent=2)+"\\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Retain this issue revision and its source evidence as a run artifact
        if: steps.schedule.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MSK-UNAPPROVED-${{ steps.schedule.outputs.issue }}-${{ github.run_id }}
          path: ${{ steps.schedule.outputs.run_root }}/
          if-no-files-found: error
          retention-days: 90
      - name: Append revision to one durable PRIVATE draft release per issue
        if: steps.schedule.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.schedule.outputs.issue }}
          MODE: ${{ steps.schedule.outputs.mode }}
          RUN_ROOT: ${{ steps.schedule.outputs.run_root }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ROOT="$RUN_ROOT/output/$ISSUE"
          ASSETS="$RUN_ROOT/assets"
          PREVIOUS="$RUN_ROOT/previous"
          mkdir -p "$ASSETS" "$PREVIOUS"
          test -f "$ROOT/MSK_${ISSUE}_EDITORIAL_DRAFT.pdf"
          test -f "$ROOT/release_gate.json"
          TAG="msk-magazine-${ISSUE}-draft"
          PDF_ASSET="$ASSETS/MSK_${ISSUE}_EDITORIAL_DRAFT_${RUN_ID}.pdf"
          GATE_ASSET="$ASSETS/release_gate_${RUN_ID}.json"
          ARCHIVE_ASSET="$ASSETS/source_page_evidence_${RUN_ID}.tar.gz"
          cp "$ROOT/MSK_${ISSUE}_EDITORIAL_DRAFT.pdf" "$PDF_ASSET"
          cp "$ROOT/release_gate.json" "$GATE_ASSET"
          tar -czf "$ARCHIVE_ASSET" -C "$RUN_ROOT" sources output/$ISSUE
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release download "$TAG" --pattern "ledger.json" --dir "$PREVIOUS"; then
              cp "$PREVIOUS/ledger.json" "$ASSETS/ledger.json"
            else
              printf '{"issue":"%s","runs":[]}\\n' "$ISSUE" > "$ASSETS/ledger.json"
            fi
          else
            printf '{"issue":"%s","runs":[]}\\n' "$ISSUE" > "$ASSETS/ledger.json"
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assets = Path(os.environ["RUN_ROOT"]) / "assets"
          pdf = next(assets.glob(f"MSK_{os.environ['ISSUE']}_EDITORIAL_DRAFT_{os.environ['RUN_ID']}.pdf"))
          ledger_file = assets / "ledger.json"
          ledger = json.loads(ledger_file.read_text(encoding="utf-8"))
          ledger.setdefault("runs", []).append({
              "run_id": os.environ["RUN_ID"], "run_url": os.environ["RUN_URL"],
              "commit_sha": os.environ["RUN_SHA"], "mode": os.environ["MODE"],
              "pdf_asset": pdf.name, "pdf_sha256": hashlib.sha256(pdf.read_bytes()).hexdigest(),
              "source_authenticity_verified": False, "publication_allowed": False,
          })
          ledger_file.write_text(json.dumps(ledger, indent=2)+"\\n", encoding="utf-8")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PDF_ASSET" "$GATE_ASSET" "$ARCHIVE_ASSET" "$ASSETS/ledger.json" --clobber
            echo "Appended revision to existing draft release $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" "$PDF_ASSET" "$GATE_ASSET" "$ARCHIVE_ASSET" "$ASSETS/ledger.json" \
              --draft --title "MSK Magazine $ISSUE | UNAPPROVED draft archive" \
              --notes "Daily revisions are preserved as separate assets in one draft release. All pages remain editorially pending. Source authenticity, publication and owner approval are false. No Telegram send."
            echo "Created one draft release for issue $ISSUE: $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report first-Monday start or daily continuation status
        if: steps.schedule.outputs.due == 'true'
        env:
          ISSUE: ${{ steps.schedule.outputs.issue }}
          MODE: ${{ steps.schedule.outputs.mode }}
          RUN_ROOT: ${{ steps.schedule.outputs.run_root }}
        run: |
          echo "### MSK Magazine $ISSUE — $MODE — UNAPPROVED DRAFT" >> "$GITHUB_STEP_SUMMARY"
          echo "This run uses an isolated revision folder; previous run evidence is not overwritten." >> "$GITHUB_STEP_SUMMARY"
          echo "Source authenticity, original editorial research, owner approval and publication remain FALSE/PENDING." >> "$GITHUB_STEP_SUMMARY"
          echo "No Telegram send, public release or auto-approval. Pages are templates until original research is supplied." >> "$GITHUB_STEP_SUMMARY"
          echo "Revision evidence is retained in the run artifact and appended to the same monthly draft release." >> "$GITHUB_STEP_SUMMARY"
