name: Market Breadth Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  market-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests yfinance
      - name: Check Python syntax
        run: python -m py_compile main.py market_breadth.py market_data.py test_market_breadth.py
      - name: Run market breadth regression tests
        run: python -m unittest -v test_market_breadth
