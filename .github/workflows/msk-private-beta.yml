name: MSK Private Beta release validation
on:
  pull_request:
    paths:
      - 'main.py'
      - 'msk_ai_builder_*.py'
      - 'tests/test_msk_private_beta_wizard.py'
      - 'tests/test_msk_ai_builder_beta.py'
      - '.github/workflows/msk-private-beta.yml'
permissions:
  contents: read
jobs:
  private-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.2.5 'pypdf>=5,<7' pandas==2.2.2 numpy==1.26.4 requests==2.32.3
      - run: python -m py_compile main.py
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_beta.py' -v
      - run: python -m unittest discover -s tests -p 'test_msk_private_beta_wizard.py' -v
      - run: python -m unittest discover -s tests -p 'test_portfolio_builder_form.py' -v
