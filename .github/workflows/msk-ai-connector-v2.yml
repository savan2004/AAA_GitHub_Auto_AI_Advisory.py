name: MSK AI connector v3 — unified accuracy and safety contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'ai_engine.py'
      - 'msk_ai_output_guard_v3.py'
      - 'msk_ai_market_context_v3.py'
      - 'llm_wrapper.py'
      - 'health_monitor.py'
      - 'main.py'
      - 'tests/test_msk_ai_connector_v3.py'
      - 'msk_ai_connector_v2.py'
      - 'tests/test_msk_ai_connector_v2.py'
      - '.github/workflows/msk-ai-connector-v2.yml'
      - 'docs/MSK_AI_CONNECTOR_V2.md'
  push:
    branches: [main]
    paths:
      - 'ai_engine.py'
      - 'msk_ai_output_guard_v3.py'
      - 'msk_ai_market_context_v3.py'
      - 'llm_wrapper.py'
      - 'health_monitor.py'
      - 'main.py'
      - 'tests/test_msk_ai_connector_v3.py'
      - 'msk_ai_connector_v2.py'
      - 'tests/test_msk_ai_connector_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connector-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing HTTP dependency
        run: python -m pip install requests==2.32.3
      - name: Compile new connector and legacy API facade
        run: python -m py_compile msk_ai_connector_v2.py msk_ai_output_guard_v3.py msk_ai_market_context_v3.py ai_engine.py llm_wrapper.py health_monitor.py main.py tests/test_msk_ai_connector_v2.py tests/test_msk_ai_connector_v3.py
      - name: Test model updates, pricing gate, provider fallback and numeric grounding
        run: python -m unittest discover -s tests -p 'test_msk_ai_connector_v*.py' -v
      - name: No automatic investment publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('msk_builder_research_release_registry.json').read_text())
          assert row['publication_status']=='WITHHELD'
          assert row['approved']==[]
          PY
