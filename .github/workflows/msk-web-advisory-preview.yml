name: MSK Web Advisory Preview
on:
  push:
    branches: [web/msk-web-advisory-mvp-20261027]
    paths:
      - 'web_advisory/**'
      - '.github/workflows/msk-web-advisory-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web_advisory/**'
      - '.github/workflows/msk-web-advisory-preview.yml'
  workflow_dispatch:

jobs:
  static-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline application JavaScript syntax
        run: node --check web_advisory/app.js && node --check web_advisory/config.js && node --check web_advisory/features.js && node --check web_advisory/market_widget.js
      - name: Install lightweight browser simulator
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Click-through tests for every button and every CSV/AI route
        run: node --test web_advisory/tests/ui.test.cjs
      - name: Verify no Telegram keys, no live-data claims, source-aware MVP
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('web_advisory/index.html').read_text()
          a=Path('web_advisory/app.js').read_text()
          s=Path('web_advisory/config.js').read_text()
          assert all(x in h for x in ['csvFile','chartCanvas','chatForm','dataLabel','market_widget.js'])
          f=Path('web_advisory/features.js').read_text()
          assert all(x in a for x in ['No clean pattern','SYNTHETIC','timestamp','volume'])
          assert all(x in f for x in ['offlineAnswer','fundamentalTab','screenerTab','breadthTab','importBars'])
          w=Path('web_advisory/market_widget.js').read_text()
          assert all(x in w for x in ['NSE:', 'tv-advanced-chart', 'NOT ASSESSED', 'imported MSK market data'])
          assert 'embed-widget-advanced-chart.js' not in w
          assert 'embed-widget-financials.js' not in w
          assert 'tv-advanced-chart.js' in h
          assert 'window.MSK_WEB_API = "https://br-cool-poetry-a1bhjhc3-mskwebapi.compute.c-1.ap-southeast-1.aws.neon.tech";' in s
          import re
          assert not re.search(r'(?m)^\s*(?:TELEGRAM_TOKEN|GROQ_API_KEY|GEMINI_API_KEY)\s*=', s)
          print('MSK_WEB_PREVIEW_SECURITY_CHECKS_OK')
          PY
      - name: Verify live Neon API health, legal-data flag and browser CORS
        run: |
          node --input-type=module <<'JS'
          const url = 'https://br-cool-poetry-a1bhjhc3-mskwebapi.compute.c-1.ap-southeast-1.aws.neon.tech';
          const response = await fetch(url + '/api/health', {headers: {origin: 'https://msk-web-advisory-preview.onrender.com'},signal:AbortSignal.timeout(18000)});
          if (!response.ok) throw new Error('Neon API HTTP ' + response.status);
          const body = await response.json();
          if (!body.ok || body.generative_ai !== 'disabled' || body.live_market_feed !== 'not_configured') throw new Error('Unexpected backend capability status');
          if (response.headers.get('access-control-allow-origin') !== 'https://msk-web-advisory-preview.onrender.com') throw new Error('CORS origin mismatch');
          console.log('MSK_NEON_API_HEALTH_OK — AI disabled until secured; no market-feed license inferred');
          JS
      - name: Verify LIVE Render website serves current functional scripts
        run: |
          node --input-type=module <<'JS'
          const host = 'https://msk-web-advisory-preview.onrender.com';
          for (const [route,marker] of [
            ['/', 'features.js'],
            ['/app.js', 'window.MSKWeb='],
            ['/features.js', 'DEMO01'],
            ['/market_widget.js', 'tv-advanced-chart'],
            ['/config.js', 'br-cool-poetry-a1bhjhc3-mskwebapi']
          ]) {
            const response = await fetch(host + route, {signal:AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error(route + ' live HTTP ' + response.status);
            const source = await response.text();
            if (!source.includes(marker)) throw new Error(route + ' is stale or incomplete');
            console.log('RENDER_LIVE_OK', route, source.length);
          }
          JS
