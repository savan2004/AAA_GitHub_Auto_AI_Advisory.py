name: MSK Lite Repair Control Tests
on:
  pull_request:
    paths:
      - 'tools/msk_repair_control.py'
      - 'tools/msk_control_panel.py'
      - 'tools/msk_safe_recovery.py'
      - 'tests/test_msk_repair_control.py'
      - 'tests/test_msk_control_panel.py'
      - 'tests/test_msk_safe_recovery.py'
      - '.github/workflows/msk-lite-repair-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated tests
        run: |
          python -m unittest discover -s tests -p 'test_msk_repair_control.py' -v
          python -m unittest discover -s tests -p 'test_msk_control_panel.py' -v
          python -m unittest discover -s tests -p 'test_msk_safe_recovery.py' -v
