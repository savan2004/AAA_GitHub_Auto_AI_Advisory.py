name: MSK Daily PDF Offline Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'report_generator.py'
      - 'scripts/msk_daily_fundamental_pdf.py'
      - 'tests/test_msk_daily_fundamental_pdf.py'
      - '.github/workflows/msk-daily-fundamental-pdf*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install report runtime for offline fixtures
        run: python -m pip install --disable-pip-version-check -r requirements.txt pypdf
      - name: Validate daily research PDF (no network, Telegram or AI)
        run: python -m unittest discover -s tests -p test_msk_daily_fundamental_pdf.py -v
      - name: Python syntax
        run: python -m py_compile report_generator.py scripts/msk_daily_fundamental_pdf.py
