name: MSK Index Top 5 Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'index_constituents.py'
      - 'index_top5.py'
      - 'overnight_index_reports.py'
      - 'overnight_index_sources.py'
      - 'tests/test_overnight_index_reports.py'
      - 'top5_technical_ratings.py'
      - 'top5_company_ratings.py'
      - 'tests/test_top5_risk_cards.py'
      - 'top5_fundamental_gate.py'
      - 'tests/test_top5_fundamental_gate.py'
      - 'main.py'
      - 'conservative_screener.py'
      - 'tests/test_index_top5.py'
      - '.github/workflows/msk-index-top5.yml'
  push:
    branches: [main]
    paths:
      - 'index_constituents.py'
      - 'index_top5.py'
      - 'top5_technical_ratings.py'
      - 'top5_company_ratings.py'
      - 'tests/test_top5_risk_cards.py'
      - 'top5_fundamental_gate.py'
      - 'tests/test_top5_fundamental_gate.py'
      - 'main.py'
      - 'conservative_screener.py'
      - 'tests/test_index_top5.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' requests
      - name: Compile new and existing modules
        run: python -m py_compile main.py conservative_screener.py index_constituents.py index_top5.py top5_fundamental_gate.py tests/test_index_top5.py tests/test_top5_fundamental_gate.py top5_technical_ratings.py top5_company_ratings.py tests/test_top5_risk_cards.py
      - name: Verify NSE index list parsing, Top-5 selection and async Telegram delivery
        run: MSK_INDEX_PREPARED_ONLY=0 python -m unittest discover -s tests -p 'test_index_top5.py' -v
      - name: Verify live-report freshness, valuation, debt and earnings gates
        run: python -m unittest discover -s tests -p 'test_top5_fundamental_gate.py' -v
      - name: Verify Top-5 financial/technical ratings and actual SL/RR calculations
        run: python -m unittest discover -s tests -p 'test_top5_risk_cards.py' -v
      - name: Verify Conservative fail-closed rules stay intact
        run: python -m unittest discover -s tests -p 'test_conservative_shortlist.py' -v

      - name: Verify real official Nifty 100 mirror (read-only)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 289 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/msk-nifty100-official-mirror-20261127'
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import index_constituents as ic
          response = ic.requests.get(
              ic._NIFTY100_OFFICIAL_MIRROR,
              timeout=(5, 12),
              headers={"User-Agent": "Mozilla/5.0", "Accept": "text/csv,text/plain,*/*"},
          )
          response.raise_for_status()
          symbols, industries = ic.parse_constituents(response.content, "conservative")
          assert len(symbols) == len(set(symbols)) == 100, "Official mirror must have 100 distinct symbols"
          print("OFFICIAL_NIFTY100_MIRROR_VERIFIED=100/100")
          print("OFFICIAL_NIFTY100_CLASSIFIED=" + str(sum(industries[s] != "Unclassified" for s in symbols)))
          PY
