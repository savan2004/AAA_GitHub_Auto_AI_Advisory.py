name: MSK Doctor Advanced Evidence + Privacy Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'portfolio_doctor_live.py'
      - 'portfolio_doctor_input.py'
      - 'portfolio_doctor_calculations.py'
      - 'portfolio_doctor_report.py'
      - 'portfolio_doctor_visual.py'
      - 'tests/test_portfolio_doctor_visual.py'
      - 'portfolio_doctor_peers.py'
      - 'tests/test_portfolio_doctor_peers.py'
      - 'scripts/msk_doctor_public_peers_probe.py'
      - 'tests/test_portfolio_doctor_rewrite.py'
      - 'tests/test_portfolio_doctor_cleanup.py'
      - 'tests/test_portfolio_doctor_deep_repair.py'
      - 'portfolio_doctor_bhavcopy.py'
      - 'tests/test_portfolio_doctor_bhavcopy.py'
      - 'portfolio_doctor_advanced.py'
      - 'portfolio_doctor_advanced_pdf.py'
      - 'portfolio_doctor_builder_private.py'
      - 'tests/test_portfolio_doctor_builder_private.py'
      - 'scripts/msk_doctor_public_provider_probe.py'
      - 'tests/test_portfolio_doctor_advanced.py'
      - 'tests/test_portfolio_doctor_stale_recovery.py'
      - 'scripts/msk_doctor_public_eod_probe.py'
      - 'scripts/msk_doctor_public_memory_probe.py'
      - 'tests/test_portfolio_doctor_private_integration.py'
      - 'main.py'
      - '.github/workflows/msk-portfolio-doctor-advanced.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advanced-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install 'pandas==2.2.2' 'numpy==1.26.4' 'requests==2.32.3' 'reportlab==4.2.5' 'pypdf>=5,<7' 'openpyxl==3.1.5' 'yfinance==0.2.61' 'curl_cffi==0.7.4'
      - name: Compile advanced modules and basic worker
        run: python -m py_compile portfolio_doctor_advanced.py portfolio_doctor_advanced_pdf.py portfolio_doctor_builder_private.py portfolio_doctor_live.py portfolio_doctor_visual.py portfolio_doctor_peers.py portfolio_doctor_bhavcopy.py main.py
      - name: Run deterministic financial, privacy and PDF tests
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_advanced.py' -v
      - name: Test optional builder input, prices, cash, PDF and delivery isolation
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_builder_private.py' -v
      - name: Test strict official NSE bhavcopy overlap and no-storage safeguards
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_bhavcopy.py' -v
      - name: Test provider freshness recovery and complete-portfolio safety
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_stale_recovery.py' -v
      - name: Run real isolated Telegram handler simulations
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_private_integration.py' -v
      - name: Run existing basic Doctor safeguards
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_safety.py' -v
      - name: Test Doctor RSI accuracy and complete upload parsing
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_deep_repair.py' -v

      - name: Test consolidated Doctor rewrite boundaries and full PDF content
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_rewrite.py' -v

      - name: Test redesigned four-page report and verified peers
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_visual.py' -v

      - name: Test official Nifty 500 peer screening and PDF evidence gates
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_peers.py' -v

      - name: Test retired-path removal, strict evidence and private session expiry
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_cleanup.py' -v

  public-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public issuer read dependencies
        run: python -m pip install 'requests==2.32.3'
      - name: Probe public issuer data without customer input
        run: PYTHONPATH=. python scripts/msk_doctor_public_provider_probe.py
      - name: Probe official Nifty 500 roster without customer holdings
        run: PYTHONPATH=. python scripts/msk_doctor_public_peers_probe.py

  public-eod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public EOD probe dependencies
        run: python -m pip install 'pandas==2.2.2' 'numpy==1.26.4' 'requests==2.32.3' 'yfinance==0.2.61' 'curl_cffi==0.7.4' 'reportlab==4.2.5' 'pypdf>=5,<7' 'openpyxl==3.1.5'
      - name: Verify completed EOD date for public INFY, using fallback on stale primary
        run: MSK_RESEARCH_ONLY=1 PYTHONPATH=. python scripts/msk_doctor_public_eod_probe.py

      - name: Exercise real CSV/XLSX PDFs and concurrent private workers with public data
        run: MSK_RESEARCH_ONLY=1 PYTHONPATH=. python scripts/msk_doctor_public_memory_probe.py
