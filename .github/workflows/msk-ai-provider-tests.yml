name: MSK AI Provider Fallback Tests
on:
  pull_request:
    paths:
      - 'llm_wrapper.py'
      - 'ai_engine.py'
      - 'requirements.txt'
      - 'tests/test_ai_provider_fallback.py'
      - '.github/workflows/msk-ai-provider-tests.yml'
  workflow_dispatch:
jobs:
  ai-provider-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned provider dependencies
        run: python -m pip install 'requests==2.32.3' 'groq==0.8.0' 'openai==1.35.0' 'httpx==0.27.2'
      - name: Verify installed provider client initialization
        run: |
          python -c "import os; from groq import Groq; from openai import OpenAI; Groq(api_key='test-placeholder'); OpenAI(api_key='test-placeholder'); print('Provider SDK initialization OK')"
      - name: Compile and test fallback
        run: |
          python -m py_compile ai_engine.py llm_wrapper.py
          python -m unittest discover -s tests -p 'test_ai_provider_fallback.py' -v
