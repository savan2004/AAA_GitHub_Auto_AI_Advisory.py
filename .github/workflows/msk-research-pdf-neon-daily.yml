name: MSK Research PDF Verified Daily Neon Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'research_pdf_snapshot.py'
      - 'scripts/publish_research_pdf.py'
      - 'research_pdf_price_guard.py'
      - 'research_pdf_fresh_history.py'
      - 'tests/test_research_pdf_fresh_history.py'
      - 'report_generator.py'
      - 'tests/test_report_market_session_guard.py'
      - 'tests/test_report_button_release_gate.py'
      - 'tests/test_research_pdf_snapshot.py'
      - 'tests/test_live_pdf_symbol_choice.py'
      - '.github/workflows/msk-research-pdf-neon-daily.yml'
  push:
    branches: [main]
    paths:
      - 'research_pdf_snapshot.py'
      - 'scripts/publish_research_pdf.py'
      - 'research_pdf_price_guard.py'
      - 'research_pdf_fresh_history.py'
      - 'tests/test_research_pdf_fresh_history.py'
      - 'report_generator.py'
      - 'tests/test_report_market_session_guard.py'
      - 'tests/test_research_pdf_snapshot.py'
      - 'tests/test_live_pdf_symbol_choice.py'
      - '.github/workflows/msk-research-pdf-neon-daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1-5'  # 18:45 IST weekdays, completed NSE daily session

permissions:
  contents: read

concurrency:
  group: msk-research-pdf-verified-daily
  cancel-in-progress: false

jobs:
  cache-safety-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline validation dependencies
        run: python -m pip install 'pypdf>=5,<7' 'pandas>=2.1,<3' 'numpy>=1.26,<3'
      - name: Compile cache, real button and publishing scripts
        run: python -m py_compile main.py research_pdf_snapshot.py scripts/publish_research_pdf.py tests/test_research_pdf_snapshot.py tests/test_report_button_release_gate.py research_pdf_price_guard.py tests/test_report_market_session_guard.py report_generator.py research_pdf_fresh_history.py tests/test_research_pdf_fresh_history.py
      - name: Verify no stale data, no forged PDF and no slow re-download on cache hit
        run: python -m unittest discover -s tests -p test_research_pdf_snapshot.py -v
      - name: Verify customer button sends only disclosure-checked PDFs
        run: python -m unittest discover -s tests -p test_report_button_release_gate.py -v
      - name: Verify EOD freshness even when PDF text extraction misses the cover date
        run: python -m unittest discover -s tests -p test_report_market_session_guard.py -v
      - name: Verify lagging provider is replaced only by verified current full-year prices
        run: python -m unittest discover -s tests -p test_research_pdf_fresh_history.py -v
      - name: Verify independent DLF owner-only Report test scope
        run: python -m unittest discover -s tests -p test_live_pdf_symbol_choice.py -v

  genuine-pdf-price-source:
    # Real public data on PR; no Neon write, no Telegram and no credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free market data dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'yfinance>=0.2.60,<0.3' 'requests>=2.32,<3'
      - name: Check genuine SBIN/DLF completed-session daily candles
        run: |
          python - <<'PY'
          from market_breadth import expected_completed_session
          from research_pdf_fresh_history import _independent_yahoo_windows
          session = str(expected_completed_session())
          for symbol in ("SBIN", "DLF"):
              frame = _independent_yahoo_windows(symbol, session)
              if frame is None:
                  raise RuntimeError("No same-provider complete-session source for " + symbol + "; do not publish PDF")
              print("MSK_PDF_REAL_SOURCE symbol={} session={} count={} close={:.2f}".format(
                  symbol, str(frame.index[-1].date()), len(frame), float(frame["Close"].iloc[-1])))
          PY

  real-public-report:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSK_INDEX_DATABASE_URL: ${{ secrets.MSK_INDEX_DATABASE_URL }}
      MSK_RESEARCH_ONLY: '1'
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Kolkata
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require dedicated TLS research connection (never portfolio)
        run: |
          if [ -z "$MSK_INDEX_DATABASE_URL" ]; then
            echo "::error::Protected research Neon connection not configured"
            exit 1
          fi
      - name: Install genuine research/report dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and verify real SBIN PDF bytes, pages and Neon readback
        run: python -m scripts.publish_research_pdf

  real-dlf-report:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSK_INDEX_DATABASE_URL: ${{ secrets.MSK_INDEX_DATABASE_URL }}
      MSK_RESEARCH_ONLY: '1'
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Kolkata
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed if independent research Neon is absent
        run: |
          if [ -z "$MSK_INDEX_DATABASE_URL" ]; then
            echo "::error::Protected MSK research database unavailable"
            exit 1
          fi
      - name: Install real equity research and PDF generation dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate real DLF 8-page report and verify Neon bytes/readback
        run: python -m scripts.publish_research_pdf DLF
