name: MSK Business Model and Forecast PDF Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'business_model_forecast.py'
      - 'report_generator.py'
      - 'tests/test_business_model_forecast.py'
      - '.github/workflows/msk-business-forecast-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing report dependencies (no paid AI)
        run: python -m pip install --disable-pip-version-check -r requirements.txt pypdf
      - name: Verify filings, forecast maths and PDF rendering offline
        env:
          TELEGRAM_TOKEN: '123:offline-test-only'
        run: python -m unittest discover -s tests -p test_business_model_forecast.py -v
      - name: Syntax
        run: python -m py_compile business_model_forecast.py report_generator.py
