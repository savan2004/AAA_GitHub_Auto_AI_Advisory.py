name: MSK Real Large Cap Source Probe
on:
  push:
    branches: [main]
    paths:
      - research_data.py
      - index_top5.py
      - .github/workflows/msk-largecap-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consensus-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests yfinance pandas numpy
      - run: python -m unittest discover -s tests -p 'test_consensus_401_circuit.py' -v
  live-largecap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSK_INDEX_PREPARED_ONLY: '0'
      MSK_RESEARCH_ONLY: '1'  # allow independent financial worker without Telegram token
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Real Nifty100 evidence sample (never publish incomplete picks)
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
          from index_top5 import _build_index_top5
          result = _build_index_top5("conservative")
          print("LIVE_LARGECAP_RESULT_RECORDED=" + str(bool(result)))
          PY
