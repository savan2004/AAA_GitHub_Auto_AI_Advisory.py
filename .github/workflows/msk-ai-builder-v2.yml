name: MSK AI Builder V2 offline tests
on:
  pull_request:
    paths:
      - 'msk_ai_builder_*.py'
      - 'tests/test_msk_ai_builder_*.py'
      - 'research_data.py'
      - 'portfolio_doctor_advanced.py'
      - '.github/workflows/msk-ai-builder-v2.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 pandas==2.2.2 numpy==1.26.4 reportlab==4.2.5 'pypdf>=5.0,<7.0' -r requirements-builder-optimizer.txt
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_*.py' -v
      - name: Produce offline approved-profile PDF
        run: python -m msk_ai_builder_demo_pdf --capital 1000000 --risk medium --months 18 --output msk-builder-fictional-demo.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: msk-builder-fictional-demo
          path: msk-builder-fictional-demo.pdf
          if-no-files-found: error
          retention-days: 7
  postgres-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MSK_BUILDER_TEST_POSTGRES: postgresql://builder_test:local_ci_only@localhost:5432/builder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 'psycopg[binary]>=3.2,<3.4'
      - run: python -m unittest discover -s tests -p 'test_msk_ai_builder_bank.py' -v
