name: MSK Market Participation Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - 'market_breadth.py'
      - 'test_market_breadth.py'
      - '.github/workflows/msk-breadth-freshness-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market breadth test dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.2 numpy==1.26.4 requests==2.32.3 yfinance==0.2.61
      - name: Run offline breadth regression (no network or Telegram)
        run: python -m unittest test_market_breadth -v
      - name: Check syntax
        run: python -m py_compile market_breadth.py test_market_breadth.py
