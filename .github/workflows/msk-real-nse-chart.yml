name: MSK Real NSE Candlestick Visual
on:
  pull_request:
    branches: [main]
    paths:
      - 'demo/render_realistic_nse_chart.py'
      - 'trading_chart/**'
      - '.github/workflows/msk-real-nse-chart.yml'
  workflow_dispatch:

jobs:
  real-candlestick:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install chart and exact Yahoo session dependencies
        run: python -m pip install "numpy>=1.26.4,<3" "pandas>=2.2.2,<3" "matplotlib==3.9.0" "yfinance==0.2.61" "curl_cffi==0.7.4"
      - name: Render genuine NSE candle OHLC chart; reject absent Yahoo data
        run: python -u demo/render_realistic_nse_chart.py
      - name: Upload real NSE PNG and data provenance
        uses: actions/upload-artifact@v4
        with:
          name: msk-reliance-real-candlestick-sample
          path: msk_real_chart_example/
          retention-days: 7
