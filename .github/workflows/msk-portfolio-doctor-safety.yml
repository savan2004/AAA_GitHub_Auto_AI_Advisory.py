name: MSK Portfolio Doctor Stateless Private Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'portfolio_doctor_live.py'
      - 'portfolio_audit_report.py'
      - 'portfolio_audit_bridge.py'
      - 'tests/test_portfolio_audit_canary.py'
      - 'portfolio_doctor_input.py'
      - 'portfolio_doctor_calculations.py'
      - 'portfolio_doctor_report.py'
      - 'portfolio_doctor_company_research.py'
      - 'tests/test_portfolio_doctor_company_research.py'
      - 'portfolio_doctor_research_links.py'
      - 'tests/test_portfolio_doctor_full_research.py'
      - 'portfolio_doctor_visual.py'
      - 'tests/test_portfolio_doctor_visual.py'
      - 'portfolio_doctor_peers.py'
      - 'portfolio_doctor_diagnostics.py'
      - 'portfolio_doctor_risk_history.py'
      - 'tests/test_portfolio_doctor_risk_history.py'
      - 'portfolio_doctor_visual.py'
      - 'tests/test_portfolio_doctor_diagnostics.py'
      - 'tests/test_portfolio_doctor_peers.py'
      - 'tests/test_portfolio_doctor_rewrite.py'
      - 'tests/test_portfolio_doctor_cleanup.py'
      - 'tests/test_portfolio_doctor_deep_repair.py'
      - 'portfolio_doctor_bhavcopy.py'
      - 'tests/test_portfolio_doctor_bhavcopy.py'
      - 'tests/test_portfolio_doctor_safety.py'
      - 'tests/test_portfolio_doctor_ten_stock_csv.py'
      - 'tests/test_portfolio_doctor_v3_upgrades.py'
      - 'tests/test_portfolio_doctor_stale_recovery.py'
      - '.github/workflows/msk-portfolio-doctor-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline report test dependencies
        run: python -m pip install 'reportlab==4.2.5' 'pypdf>=5,<7' 'pandas==2.2.2' 'numpy==1.26.4' 'openpyxl==3.1.5' 'requests==2.32.3' 'matplotlib==3.9.0'
      - name: Compile current stateless Doctor and bot
        run: python -m py_compile portfolio_doctor_live.py portfolio_doctor_input.py portfolio_doctor_calculations.py portfolio_doctor_report.py portfolio_doctor_visual.py portfolio_doctor_peers.py portfolio_doctor_bhavcopy.py main.py portfolio_doctor_diagnostics.py portfolio_doctor_visual.py portfolio_doctor_risk_history.py portfolio_doctor_research_links.py portfolio_doctor_company_research.py portfolio_audit_report.py portfolio_audit_bridge.py
      - name: Test stateless private path (no market API or Telegram sends)
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_safety.py' -v

      - name: Validate V3 exact peer handoff, weighted fundamentals, chart and dense PDF
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_v3_upgrades.py' -v

      - name: Validate ten-stock CSV template, ten-company PDF and five-stock regression
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_ten_stock_csv.py' -v

      - name: Test private Doctor session switching, typed and upload routing
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_private_integration.py' -v

      - name: Test retired manual command and preserved calculation primitives
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_builder_private.py' -v
      - name: Test official exchange CSV and prior-day overlap
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_bhavcopy.py' -v
      - name: Test stale primary-provider recovery without synthetic prices
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_stale_recovery.py' -v

      - name: Test Doctor RSI accuracy and complete upload parsing
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_deep_repair.py' -v

      - name: Test consolidated Doctor rewrite boundaries and full PDF content
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_rewrite.py' -v

      - name: Test redesigned four-page report and verified peers
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_visual.py' -v

      - name: Test complete standalone audit metrics and 10-14 page PDF offline
        run: python portfolio_audit_report.py --test

      - name: Test private Portfolio Audit canary and old Doctor safety
        run: python -m unittest discover -s tests -p 'test_portfolio_audit_canary.py' -v

      - name: Test verified historical portfolio risk and Nifty comparison
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_risk_history.py' -v

      - name: Test five private stock dossiers, history freshness and financial source disclosure
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_company_research.py' -v

      - name: Test private full-company PDF opt-in and NSE identity
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_full_research.py' -v

      - name: Test paisa reconciliation and report diagnostic layout
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_diagnostics.py' -v

      - name: Test official Nifty 500 peer screening and PDF evidence gates
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_peers.py' -v

      - name: Test retired-path removal, strict evidence and private session expiry
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_cleanup.py' -v
