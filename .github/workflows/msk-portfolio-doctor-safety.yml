name: MSK Portfolio Doctor Stateless Private Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'portfolio_doctor_live.py'
      - 'portfolio_doctor_input.py'
      - 'portfolio_doctor_calculations.py'
      - 'portfolio_doctor_report.py'
      - 'tests/test_portfolio_doctor_rewrite.py'
      - 'tests/test_portfolio_doctor_deep_repair.py'
      - 'portfolio_doctor_bhavcopy.py'
      - 'tests/test_portfolio_doctor_bhavcopy.py'
      - 'tests/test_portfolio_doctor_safety.py'
      - 'tests/test_portfolio_doctor_stale_recovery.py'
      - '.github/workflows/msk-portfolio-doctor-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline report test dependencies
        run: python -m pip install 'reportlab==4.2.5' 'pypdf>=5,<7' 'pandas==2.2.2' 'numpy==1.26.4' 'openpyxl==3.1.5' 'requests==2.32.3'
      - name: Compile current live doctor, bot and legacy safety
        run: python -m py_compile portfolio_doctor_live.py portfolio_doctor_runner.py portfolio_doctor_bhavcopy.py main.py
      - name: Test stateless private path (no market API or Telegram sends)
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_safety.py' -v
      - name: Test official exchange CSV and prior-day overlap
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_bhavcopy.py' -v
      - name: Test stale primary-provider recovery without synthetic prices
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_stale_recovery.py' -v

      - name: Test Doctor RSI accuracy and complete upload parsing
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_deep_repair.py' -v

      - name: Test consolidated Doctor rewrite boundaries and full PDF content
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_rewrite.py' -v
