name: MSK Smart Chart Bounded Real-Data Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'gen_smart_stock_chart.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'
  push:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'gen_smart_stock_chart.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'

permissions:
  contents: read

jobs:
  safe-smart-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Compile production chart files
        run: python -m py_compile smart_chart_fast_scan.py gen_smart_stock_chart.py chart_integration.py test_smart_chart_fast_scan.py test_chart_real_error_diagnostics.py
      - name: Verify one-batch scan, genuine quotes and no stale-data ranking
        run: python -m unittest -v test_smart_chart_fast_scan test_chart_real_error_diagnostics

  real-provider-smoke:
    # Runs against genuine Yahoo market data; never sends Telegram or records trades.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual chart runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate actual auto-selected NSE chart and show exact failure
        run: |
          set +e
          timeout 70s python -u gen_smart_stock_chart.py > /tmp/msk-chart-real.txt 2>&1
          code=$?
          tail -n 65 /tmp/msk-chart-real.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::Real Smart Chart script failed (exit $code)"
            exit "$code"
          fi
          output=$(grep '^OUTPUT:' /tmp/msk-chart-real.txt | tail -1 | cut -d: -f2- | xargs)
          if [ -z "$output" ] || [ ! -s "$output" ]; then
            echo "::error::Real Smart Chart PNG missing or empty"
            exit 1
          fi
          file "$output"
