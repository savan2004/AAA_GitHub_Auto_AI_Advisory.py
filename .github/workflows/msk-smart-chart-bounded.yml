name: MSK Smart Chart Bounded Real-Data Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'gen_smart_stock_chart.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'
  push:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'gen_smart_stock_chart.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'

permissions:
  contents: read

jobs:
  safe-smart-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Compile production chart files
        run: python -m py_compile smart_chart_fast_scan.py gen_smart_stock_chart.py chart_integration.py test_smart_chart_fast_scan.py test_chart_real_error_diagnostics.py
      - name: Verify one-batch scan, genuine quotes and no stale-data ranking
        run: python -m unittest -v test_smart_chart_fast_scan test_chart_real_error_diagnostics
