name: MSK Smart Chart Bounded Real-Data Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'smart_chart_eod_recovery.py'
      - 'test_smart_chart_eod_recovery.py'
      - 'smart_chart_universe.py'
      - 'test_smart_chart_universe.py'
      - 'smart_chart_snapshot.py'
      - 'smart_chart_nse_history.py'
      - 'test_smart_chart_nse_history.py'
      - 'gen_smart_stock_chart.py'
      - 'msk_chart_context.py'
      - 'msk_chart_release.py'
      - 'msk_indicator_math.py'
      - 'msk_target_levels.py'
      - 'test_msk_chart_release.py'
      - 'test_msk_chart_context.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'
  push:
    branches: [main]
    paths:
      - 'smart_chart_fast_scan.py'
      - 'smart_chart_eod_recovery.py'
      - 'test_smart_chart_eod_recovery.py'
      - 'smart_chart_universe.py'
      - 'test_smart_chart_universe.py'
      - 'smart_chart_snapshot.py'
      - 'gen_smart_stock_chart.py'
      - 'msk_chart_context.py'
      - 'msk_chart_release.py'
      - 'msk_indicator_math.py'
      - 'msk_target_levels.py'
      - 'test_msk_chart_release.py'
      - 'test_msk_chart_context.py'
      - 'chart_integration.py'
      - 'test_smart_chart_fast_scan.py'
      - 'test_chart_real_error_diagnostics.py'
      - '.github/workflows/msk-smart-chart-bounded.yml'

permissions:
  contents: read

jobs:
  safe-smart-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.31,<3'
      - name: Compile production chart files
        run: python -m py_compile smart_chart_fast_scan.py gen_smart_stock_chart.py msk_chart_context.py test_msk_chart_context.py msk_chart_release.py msk_target_levels.py msk_indicator_math.py test_msk_chart_release.py chart_integration.py test_smart_chart_fast_scan.py test_smart_chart_nse_history.py smart_chart_nse_history.py smart_chart_universe.py test_smart_chart_universe.py smart_chart_snapshot.py test_chart_real_error_diagnostics.py smart_chart_eod_recovery.py test_smart_chart_eod_recovery.py
      - name: Verify one-batch scan, genuine quotes and no stale-data ranking
        run: python -m unittest -v test_smart_chart_fast_scan test_smart_chart_nse_history test_smart_chart_universe test_chart_real_error_diagnostics test_msk_chart_context test_msk_chart_release test_smart_chart_eod_recovery

  real-provider-smoke:
    # Runs against genuine Yahoo market data; never sends Telegram or records trades.
    env:
      MSK_NIFTY100_SNAPSHOT: .msk-public-cache/nifty100.json
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore same-day public index snapshot
        id: nifty-cache
        uses: actions/cache/restore@v4
        with:
          path: .msk-public-cache/nifty100.json
          key: msk-nifty100-${{ github.run_id }}
          restore-keys: msk-nifty100-
      - name: Install actual chart runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate actual auto-selected NSE chart and show exact failure
        run: |
          set +e
          /usr/bin/time -v timeout 180s python -u gen_smart_stock_chart.py > /tmp/msk-chart-real.txt 2>&1
          code=$?
          tail -n 85 /tmp/msk-chart-real.txt
          if [ "$code" -ne 0 ]; then
            echo "::error::Real Smart Chart script failed (exit $code)"
            exit "$code"
          fi
          output=$(grep '^OUTPUT:' /tmp/msk-chart-real.txt | tail -1 | cut -d: -f2- | xargs)
          if [ -z "$output" ] || [ ! -s "$output" ]; then
            echo "::error::Real Smart Chart PNG missing or empty"
            exit 1
          fi
          file "$output"
          python - <<'PY'
          from pathlib import Path
          from market_breadth import expected_completed_session
          from smart_chart_snapshot import _validate
          lines = Path("/tmp/msk-chart-real.txt").read_text().splitlines()
          outputs = [s.removeprefix("OUTPUT:").strip() for s in lines if s.startswith("OUTPUT:")]
          metas = [s.removeprefix("META:").strip() for s in lines if s.startswith("META:")]
          if len(outputs) != 1 or len(metas) != 1:
              raise RuntimeError("Expected one chart and one metadata record")
          image = Path(outputs[0]).read_bytes()
          _validate(image, metas[0], str(expected_completed_session()))
          print("MSK_CHART_V8_REAL_PNG_VALIDATED bytes=%d" % len(image))
          PY
      - name: Save public index snapshot when available
        if: always() && hashFiles('.msk-public-cache/nifty100.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .msk-public-cache/nifty100.json
          key: msk-nifty100-${{ github.run_id }}
      - name: Retain verified PNG for private visual QA
        uses: actions/upload-artifact@v4
        with:
          name: msk-smart-chart-real-png
          path: |
            output/chart_*.png
            /tmp/msk-chart-real.txt
          if-no-files-found: error
          retention-days: 1
