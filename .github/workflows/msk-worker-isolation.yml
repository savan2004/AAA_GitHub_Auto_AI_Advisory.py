name: MSK Webhook Isolation and Rate-limit Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/test_worker_isolation.py'
      - 'tests/test_health_endpoints.py'
      - '.github/workflows/msk-worker-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/test_worker_isolation.py'
      - 'tests/test_health_endpoints.py'
      - '.github/workflows/msk-worker-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile production entrypoint and tests
        run: python -m py_compile main.py tests/test_worker_isolation.py tests/test_health_endpoints.py
      - name: Verify worker isolation and direct-rate guards
        run: python -m unittest discover -s tests -p 'test_worker_isolation.py' -v
      - name: Verify endpoint readiness contracts
        run: python -m unittest discover -s tests -p 'test_health_endpoints.py' -v
