name: MSK Portfolio Doctor Consolidated — Private Data and PDF Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'portfolio_doctor_incomplete.py'
      - 'tests/test_msk_doctor_incomplete_contract.py'
      - 'portfolio_doctor_live.py'
      - 'portfolio_doctor_visual.py'
      - 'main.py'
      - '.github/workflows/msk-doctor-consolidated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doctor-private-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab==4.2.5' 'pypdf>=5,<7' 'pandas==2.2.2' 'numpy==1.26.4' 'openpyxl==3.1.5' 'requests==2.32.3' 'matplotlib==3.9.0'
      - name: Compile Doctor and isolated diagnosis
        run: python -m py_compile main.py portfolio_doctor_live.py portfolio_doctor_visual.py portfolio_doctor_incomplete.py
      - name: Check private incomplete-price diagnostic without customer delivery
        run: python -m unittest discover -s tests -p 'test_msk_doctor_incomplete_contract.py' -v
      - name: Existing Doctor stateless privacy contract
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_safety.py' -v
      - name: Existing Doctor versus Builder typed and upload routing
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_private_integration.py' -v
      - name: Existing four-page PDF content, calculations and navigation
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_visual.py' -v
