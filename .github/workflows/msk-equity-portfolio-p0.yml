name: MSK P0 Portfolio and Equity Regression
on:
  push:
    branches: [main]
    paths:
      - main.py
      - data_engine.py
      - fundamentals.py
      - postgres_portfolio.py
      - portfolio_migration.py
      - msk_durable_state.py
      - .github/workflows/msk-equity-portfolio-p0.yml
  pull_request:
    branches: [main]
    paths:
      - main.py
      - data_engine.py
      - fundamentals.py
      - postgres_portfolio.py
      - portfolio_migration.py
      - msk_durable_state.py
      - .github/workflows/msk-equity-portfolio-p0.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: synthetic-test-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.32,<3'
      - name: Compile equity and portfolio modules
        run: python -m py_compile main.py market_data.py data_engine.py fundamentals.py financial_quality.py technical_price_safety.py postgres_portfolio.py portfolio_backup_preflight.py portfolio_migration.py msk_durable_state.py
      - name: Portfolio and equity safety tests
        run: |
          python -m unittest discover -s tests -p 'test_msk_equity_portfolio_p0.py' -v
          python -m unittest discover -s tests -p 'test_msk_release_safety.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_backup_preflight.py' -v
          python -m unittest discover -s tests -p 'test_msk_postgres_migration.py' -v
          python -m unittest discover -s tests -p 'test_msk_financial_provenance.py' -v
          python -m unittest discover -s tests -p 'test_msk_delivery_receipts.py' -v
          python -m unittest discover -s tests -p 'test_msk_durable_state.py' -v
          python -m unittest discover -s tests -p 'test_startup_portfolio_regression.py' -v
