name: MSK P0 Equity Data and Portfolio Safety

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "data_engine.py"
      - "fundamentals.py"
      - "postgres_portfolio.py"
      - "portfolio_migration.py"
      - "msk_durable_state.py"
      - ".github/workflows/msk-equity-portfolio-p0.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "data_engine.py"
      - "fundamentals.py"
      - "financial_quality.py"
      - "technical_price_safety.py"
      - "tests/test_msk_release_safety.py"
      - "tests/test_msk_financial_provenance.py"
      - "market_data.py"
      - "postgres_portfolio.py"
      - "portfolio_backup_preflight.py"
      - "tests/test_portfolio_backup_preflight.py"
      - "msk_durable_state.py"
      - "portfolio_migration.py"
      - "tests/test_msk_equity_portfolio_p0.py"
      - "tests/test_msk_postgres_migration.py"
      - "tests/test_msk_durable_state.py"
      - "tests/test_msk_delivery_receipts.py"
      - "tests/test_msk_menu_audit.py"
      - ".github/workflows/msk-equity-portfolio-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install isolated numerical libraries
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' requests
      - name: Compile portfolio and equity data modules
        run: python -m py_compile main.py market_data.py data_engine.py fundamentals.py financial_quality.py technical_price_safety.py postgres_portfolio.py portfolio_backup_preflight.py portfolio_migration.py msk_durable_state.py tests/test_msk_equity_portfolio_p0.py tests/test_msk_postgres_migration.py tests/test_msk_durable_state.py tests/test_msk_financial_provenance.py tests/test_portfolio_backup_preflight.py tests/test_msk_release_safety.py
      - name: Test portfolio persistence and alternate equity data
        env:
          TELEGRAM_TOKEN: "synthetic-test-only-not-a-real-token"
        run: python -m unittest discover -s tests -p 'test_msk_equity_portfolio_p0.py' -v
      - name: Deep audit P0: group portfolio, verified technical as-of, limits
        env:
          TELEGRAM_TOKEN: "synthetic-test-token-not-an-actual-secret"
        run: python -m unittest discover -s tests -p 'test_msk_release_safety.py' -v
      - name: Private portfolio snapshot and source readback gate
        run: python -m unittest discover -s tests -p 'test_portfolio_backup_preflight.py' -v
      - name: PostgreSQL snapshot migration, restart and rollback simulator
        run: python -m unittest discover -s tests -p 'test_msk_postgres_migration.py' -v
      - name: Financial fiscal-period, source and reporting-scope integrity
        env:
          TELEGRAM_TOKEN: "synthetic-test-token-not-an-actual-secret"
        run: python -m unittest discover -s tests -p 'test_msk_financial_provenance.py' -v
      - name: Telegram Bot API receipt integrity
        run: python -m unittest discover -s tests -p 'test_msk_delivery_receipts.py' -v
      - name: Durable webhook restart, subscriber and failure regressions
        run: python -m unittest discover -s tests -p 'test_msk_durable_state.py' -v
      - name: Existing Telegram portfolio and webhook mock regression
        run: python -m unittest discover -s tests -p 'test_startup_portfolio_regression.py' -v
