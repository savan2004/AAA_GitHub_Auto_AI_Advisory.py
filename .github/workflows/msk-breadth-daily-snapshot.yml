name: MSK Market Breadth Verified Daily Snapshot

# Standalone only. Never operates Telegram bot or portfolio tables.
on:
  pull_request:
    branches: [main]
    paths:
      - 'market_breadth.py'
      - 'test_market_breadth.py'
      - 'scripts/collect_market_breadth.py'
      - '.github/workflows/msk-breadth-daily-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'market_breadth.py'
      - 'scripts/collect_market_breadth.py'
      - '.github/workflows/msk-breadth-daily-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'  # 18:15 IST weekdays, after daily candle publication

permissions:
  contents: read

concurrency:
  group: msk-breadth-daily-snapshot
  cancel-in-progress: false

jobs:
  offline-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' requests 'yfinance>=0.2.60,<0.3'
      - name: Compile standalone code
        run: python -m py_compile market_breadth.py market_data.py test_market_breadth.py scripts/collect_market_breadth.py
      - name: Test strict freshness, coverage and nonblocking button
        run: python -m unittest test_market_breadth -v

  collect-and-store:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MSK_INDEX_DATABASE_URL: ${{ secrets.MSK_INDEX_DATABASE_URL }}
      MSK_RESEARCH_ONLY: '1'
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require existing protected research connection
        run: |
          if [ -z "$MSK_INDEX_DATABASE_URL" ]; then
            echo "::error::Research database not configured; no breadth report published"
            exit 1
          fi
      - name: Install free-source historical market data and PostgreSQL driver
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.32,<3' 'yfinance>=0.2.60,<0.3' 'psycopg[binary]>=3.2,<3.4'
      - name: Collect genuine completed daily prices and verify saved Neon record
        run: python -m scripts.collect_market_breadth
