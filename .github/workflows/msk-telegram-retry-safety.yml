name: MSK Telegram text transport retry safety
on:
  pull_request:
    paths:
      - 'main.py'
      - 'msk_telegram_text_safety.py'
      - 'tests/test_msk_delivery_receipts.py'
      - '.github/workflows/msk-telegram-retry-safety.yml'
permissions:
  contents: read
jobs:
  retry-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile main.py msk_telegram_text_safety.py
      - run: python -m unittest discover -s tests -p test_msk_delivery_receipts.py -v
