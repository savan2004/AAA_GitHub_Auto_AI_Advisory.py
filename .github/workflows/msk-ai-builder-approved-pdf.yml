name: MSK Automatic Builder Approved-Research PDF Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'msk_ai_builder_automatic.py'
      - 'msk_ai_builder_telegram.py'
      - 'msk_ai_builder_allocation.py'
      - 'msk_ai_builder_profile.py'
      - 'msk_ai_builder_infographic.py'
      - 'tests/test_msk_ai_builder_automatic.py'
      - 'tests/test_msk_ai_builder_automatic_wizard.py'
      - '.github/workflows/msk-ai-builder-approved-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-approved-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab==4.2.5' 'pypdf>=5,<7'
      - name: Compile the production handler and private research engine
        run: python -m py_compile main.py msk_ai_builder_automatic.py msk_ai_builder_telegram.py
      - name: Validate strict evidence, five/ten/twenty allocations and real PDF renderer
        run: python -m unittest discover -s tests -p 'test_msk_ai_builder_automatic.py' -v
      - name: Exercise exact three-input Telegram handler and no-duplicate callback
        run: python -m unittest discover -s tests -p 'test_msk_ai_builder_automatic_wizard.py' -v
      - name: Ensure old private fictional preview remains isolated
        run: python -m unittest discover -s tests -p 'test_msk_private_beta_wizard.py' -v
      - name: Ensure Portfolio Doctor input is not hijacked by Builder
        run: python -m unittest discover -s tests -p 'test_portfolio_doctor_private_integration.py' -v
