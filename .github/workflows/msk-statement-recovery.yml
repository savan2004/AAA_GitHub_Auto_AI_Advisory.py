name: MSK Statement Source Recovery
on:
  push:
    branches: [main]
    paths:
      - research_data.py
      - tests/test_statement_source_recovery.py
      - .github/workflows/msk-statement-recovery.yml
  pull_request:
    paths:
      - research_data.py
      - tests/test_statement_source_recovery.py
      - .github/workflows/msk-statement-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  financial-outage-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TELEGRAM_TOKEN: '123:offline-test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Confirm short cache and data provider fallback
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_statement_source_recovery.py' -v
      - name: Syntax safety
        run: python -m py_compile research_data.py tests/test_statement_source_recovery.py
