name: MSK weekly internal research refresh
on:
  schedule:
    # Saturday 09:00 IST, Sunday 09:00 IST recovery only.
    - cron: '30 3 * * 6,0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msk-builder-weekly-internal
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && vars.MSK_BUILDER_WEEKLY_JOB_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 pandas==2.2.2 numpy==1.26.4 yfinance==0.2.61 curl_cffi==0.7.4 'psycopg[binary]>=3.2,<3.4'
      - name: Refresh internal staging only
        env:
          MSK_BUILDER_WEEKLY_JOB_ENABLED: '1'
          MSK_BUILDER_BANK_ENABLED: 'true'
          MSK_BUILDER_BANK_DATABASE_URL: ${{ secrets.MSK_BUILDER_BANK_DATABASE_URL }}
        run: python -m msk_ai_builder_weekly_job
