name: PR94 P0 Live Integration (explicit opt-in)

# workflow_dispatch can be used once this workflow also exists on default.
# Before merge, the manual PR label 'p0-integration-approved' triggers both.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_market:
        description: "Run real NSE/Yahoo 50-stock coverage checks"
        type: boolean
        default: false
      run_postgres:
        description: "Run isolated synthetic Postgres migration and restore"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  market-live:
    name: Live 50 NSE equities + two indices
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_market) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 94 &&
       contains(github.event.pull_request.labels.*.name, 'p0-integration-approved'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install live-provider dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' requests 'yfinance==0.2.61' 'curl_cffi>=0.7,<1'
      - name: Run real requests (failure is genuine failure)
        env:
          PYTHONPATH: "."
          TELEGRAM_TOKEN: "synthetic-test-token-not-an-actual-secret"
          MSK_ALLOW_EXTERNAL_MARKET_TEST: "YES"
          MSK_MARKET_TEST_REPORT: "pr94-market-coverage.json"
          MSK_MIN_COVERAGE_PERCENT: "70"
        run: timeout --signal=TERM 900s python tests/pr94_market_integration.py
      - name: Upload evidence even when data sources fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr94-market-coverage
          path: pr94-market-coverage.json
          if-no-files-found: warn

  postgres-synthetic:
    name: Isolated TLS PostgreSQL migration and restore
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_postgres) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 94 &&
       contains(github.event.pull_request.labels.*.name, 'p0-integration-approved'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client and Python DB library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install 'psycopg[binary]>=3.2,<3.4'
      - name: Start temporary TLS PostgreSQL 16, localhost only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/msk-pr94-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/msk-pr94-tls/server.key" \
            -out "$RUNNER_TEMP/msk-pr94-tls/server.crt" \
            -subj "/CN=localhost" >/dev/null 2>&1
          sudo chown -R 999:999 "$RUNNER_TEMP/msk-pr94-tls"
          sudo chmod 600 "$RUNNER_TEMP/msk-pr94-tls/server.key"
          docker run -d --name msk-pr94-postgres \
            -e POSTGRES_USER=msk_test \
            -e POSTGRES_PASSWORD=pr94-synthetic-test-only \
            -e POSTGRES_DB=msk_pr94_integration \
            -p 127.0.0.1:55432:5432 \
            -v "$RUNNER_TEMP/msk-pr94-tls:/certs:ro" \
            postgres:16 -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key
          for i in $(seq 1 50); do
            if docker exec msk-pr94-postgres pg_isready -U msk_test -d msk_pr94_integration >/dev/null 2>&1; then
              echo "Temporary PostgreSQL ready"
              exit 0
            fi
            sleep 2
          done
          docker logs msk-pr94-postgres
          exit 1
      - name: Test real DB transactions, migration and pg_dump/pg_restore
        env:
          PYTHONPATH: "."
          MSK_ALLOW_POSTGRES_TEST: "YES"
          MSK_PR94_TEST_DATABASE_URL: "postgresql://msk_test:pr94-synthetic-test-only@127.0.0.1:55432/msk_pr94_integration?sslmode=require"
        run: timeout --signal=TERM 240s python tests/pr94_postgres_integration.py
      - name: Print temporary database logs on failure
        if: failure()
        run: docker logs --tail 100 msk-pr94-postgres
