name: MSK overnight index research
on:
  schedule:
    # UTC: 16:15, 20:30, 01:00, 05:00, 07:15 IST
    - cron: '45 10 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '45 1 * * 2-6'
    # Final 07:45 IST publication attempt
    - cron: '15 2 * * 2-6'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish completed snapshots only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: msk-overnight-index-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MSK_RESEARCH_DATABASE_URL: ${{ secrets.MSK_RESEARCH_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify shared database configured
        run: test -n "$MSK_RESEARCH_DATABASE_URL"
      - name: Research next batch / publish
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.publish }}" == "true" || "${{ github.event.schedule }}" == "15 2 * * 2-6" ]]; then
            python overnight_index_research.py --publish
          else
            python overnight_index_research.py --limit 100
          fi
