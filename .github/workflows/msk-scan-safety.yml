name: MSK Scanner Deadline & NSE Symbols
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/test_scan_timeout.py'
      - '.github/workflows/msk-scan-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/test_scan_timeout.py'
      - '.github/workflows/msk-scan-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile production scanner and regression
        run: python -m py_compile main.py tests/test_scan_timeout.py
      - name: Offline delayed-worker scanner simulation
        run: python -m unittest discover -s tests -p 'test_scan_timeout.py' -v
