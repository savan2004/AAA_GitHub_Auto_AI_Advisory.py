name: MSK Groq Provider Compatibility
on:
  push:
    branches: [main]
    paths:
      - 'ai_engine.py'
      - 'llm_wrapper.py'
      - 'requirements.txt'
      - 'tests/test_groq_compatibility.py'
      - '.github/workflows/msk-groq-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai_engine.py'
      - 'llm_wrapper.py'
      - 'requirements.txt'
      - 'tests/test_groq_compatibility.py'
      - '.github/workflows/msk-groq-tests.yml'
  workflow_dispatch:

jobs:
  groq-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install compatible provider dependencies
        run: python -m pip install groq==0.8.0 openai==1.35.0 httpx==0.27.2 requests==2.32.3
      - name: Compile provider modules
        run: python -m py_compile ai_engine.py llm_wrapper.py
      - name: Run offline Groq and fallback regression tests
        run: python -m unittest discover -s tests -p 'test_groq_compatibility.py' -v
