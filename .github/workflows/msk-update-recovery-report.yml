name: MSK Telegram Recovery - Offline and Isolated PostgreSQL QA

on:
  pull_request:
    paths:
      - "msk_update_recovery.py"
      - "tests/test_msk_update_recovery.py"
      - "tests/test_msk_update_recovery_postgres.py"
      - ".github/workflows/msk-update-recovery-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: msk_recovery_test
          POSTGRES_USER: msk_test
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msk_test -d msk_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSK_RECOVERY_PG_TEST: "YES"
      MSK_RECOVERY_TEST_DATABASE_URL: "postgresql://msk_test:isolated_test_only@localhost:5432/msk_recovery_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependency
        run: python -m pip install "psycopg[binary]>=3.1,<4"
      - name: Run offline and isolated PostgreSQL regression tests
        run: |
          python -m unittest discover -s tests -p 'test_msk_update_recovery.py' -v
          python -m unittest discover -s tests -p 'test_msk_update_recovery_postgres.py' -v
          python -m py_compile msk_update_recovery.py tests/test_msk_update_recovery.py tests/test_msk_update_recovery_postgres.py
