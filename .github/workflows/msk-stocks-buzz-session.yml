name: MSK Stocks Buzz Session Safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'stocks_buzz.py'
      - 'tests/test_stocks_buzz_session.py'
      - '.github/workflows/msk-stocks-buzz-session.yml'
  push:
    branches: [main]
    paths:
      - 'stocks_buzz.py'
      - 'tests/test_stocks_buzz_session.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buzz-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - run: python -m py_compile stocks_buzz.py tests/test_stocks_buzz_session.py
      - run: python -m unittest discover -s tests -p 'test_stocks_buzz_session.py' -v
