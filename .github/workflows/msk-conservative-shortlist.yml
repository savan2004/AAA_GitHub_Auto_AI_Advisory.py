name: MSK Conservative Bullish Quality Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'conservative_screener.py'
      - 'tests/test_conservative_shortlist.py'
      - '.github/workflows/msk-conservative-shortlist.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'conservative_screener.py'
      - 'tests/test_conservative_shortlist.py'
      - '.github/workflows/msk-conservative-shortlist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conservative-shortlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic indicator test dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2,<3' 'numpy>=1.24,<3'
      - name: Compile production and test source
        run: python -m py_compile main.py conservative_screener.py tests/test_conservative_shortlist.py
      - name: Verify bullish-only, liquidity, stale data and diversification
        run: python -m unittest discover -s tests -p 'test_conservative_shortlist.py' -v
